<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ניטור ובקרת תיעוד - בקרת איכות בזמן אמת</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        medical: {
                            50: '#f0f4f8',
                            100: '#d9e2ec',
                            500: '#334e68',
                            700: '#1b4a85', /* Ziv Blue Base */
                            800: '#153a69', 
                            900: '#103058', /* Dark Metallic Blue */
                        },
                        accent: {
                            400: '#fa8042',
                            500: '#f5631b', /* Ziv Orange */
                            600: '#d95111',
                            700: '#b8420b',
                        },
                        critical: '#ef4444',
                        valid: '#10b981',
                        partial: '#f59e0b',
                        missing: '#ef4444',
                        na: '#9ca3af'
                    },
                    fontFamily: {
                        sans: ['System-ui', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    },
                    backgroundImage: {
                        'gradient-metallic': 'linear-gradient(135deg, #103058 0%, #1b4a85 100%)',
                        'gradient-accent': 'linear-gradient(135deg, #fa8042 0%, #f5631b 100%)',
                        'card-gloss': 'linear-gradient(180deg, rgba(255,255,255,1) 0%, rgba(248,250,252,1) 100%)',
                    },
                    boxShadow: {
                        'glow-orange': '0 0 15px rgba(245, 99, 27, 0.4)',
                        'glow-blue': '0 4px 20px rgba(27, 74, 133, 0.3)',
                    }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; overflow-x: hidden; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Smooth transitions */
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Glassmorphism for floating UI */
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-top: 1px solid rgba(255, 255, 255, 0.6); }
        
        /* Modern Inputs */
        input:focus, textarea:focus { outline: none; box-shadow: 0 0 0 3px rgba(245, 99, 27, 0.25); border-color: #f5631b; }
        
        /* Custom Selection */
        ::selection { background: #f5631b; color: white; }
        
        /* New animated gradient background for the login */
        .bg-animated-gradient {
            background: linear-gradient(-45deg, #f0f4f8, #d9e2ec, #ffffff, #e2e8f0);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Float animation for the logo */
        .float-anim {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        /* Pulse animation for the play button */
        .pulse-soft {
            animation: pulseSoft 2s infinite;
        }
        @keyframes pulseSoft {
            0% { box-shadow: 0 0 0 0 rgba(245, 99, 27, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(245, 99, 27, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 99, 27, 0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // תפיסת שגיאות הבטחה אסינכרוניות כדי למנוע קריסות או הודעות שגיאה מערכתיות
        window.addEventListener('unhandledrejection', function(event) {
            console.warn('Unhandled promise rejection caught:', event.reason);
            event.preventDefault(); 
        });

        const { useState, useEffect, useMemo, useRef } = React;

        const SITES = [
            { id: 'triage', name: 'טריאז\'', icon: 'fa-sort-amount-down' },
            { id: 'trauma', name: 'טראומה / דימות', icon: 'fa-x-ray' },
            { id: 'immediate', name: 'מיידיים', icon: 'fa-heartbeat' },
            { id: 'minor', name: 'קלים / דחק', icon: 'fa-band-aid' },
            { id: 'discharged', name: 'משוחררים', icon: 'fa-walking' },
            { id: 'evac_wait', name: 'אתר השהיה לפינוי', icon: 'fa-ambulance' },
            { id: 'or', name: 'חדר ניתוח', icon: 'fa-procedures' },
            { id: 'recovery', name: 'התאוששות', icon: 'fa-bed' }
        ];

        // Question Bank grouped by logical sections
        const Q_BANK = {
            id: [
                { id: 'id_num', label: 'מספר גיליון / פצוע קיים' },
                { id: 'id_date', label: 'תאריך מתועד' },
                { id: 'id_time', label: 'שעת קליטה מתועדת' },
                { id: 'id_age', label: 'גיל / מגדר (כאשר רלוונטי)' },
                { id: 'id_mechanism', label: 'מנגנון / סיבת הפגיעה' }
            ],
            pre_hospital: [
                { id: 'pre_actions', label: 'תיעוד פעולות טרם הגעה' }
            ],
            vitals: [
                { id: 'vit_time', label: 'שעת מדידת מדדים' },
                { id: 'vit_pulse', label: 'דופק' },
                { id: 'vit_bp', label: 'לחץ דם' },
                { id: 'vit_sat', label: 'סטורציה (SAT)' },
                { id: 'vit_pain', label: 'אומדן כאב' },
                { id: 'vit_gcs', label: 'מצב הכרה / GCS' }
            ],
            revitals: [
                { id: 'rev_time', label: 'שעת הערכה/מדידה חוזרת' },
                { id: 'rev_vitals', label: 'מדדים חוזרים (דופק/ל"ד/SAT)' },
                { id: 'rev_change', label: 'תיעוד שינוי במצב' }
            ],
            abcd: [
                { id: 'abcd_a', label: 'A - נתיב אוויר (הערכה וטיפול)' },
                { id: 'abcd_b', label: 'B - נשימה וטיפול' },
                { id: 'abcd_c', label: 'C - מחזור דם, דימום, FAST' },
                { id: 'abcd_d', label: 'D - אישונים ומצב נוירולוגי' }
            ],
            treatments: [
                { id: 'tx_procedures', label: 'פרוצדורות (אינטובציה, נקז וכו\')' },
                { id: 'tx_meds', label: 'תרופות (שם, מינון, דרך, שעה)' },
                { id: 'tx_blood', label: 'מוצרי דם (סוג, כמות, שעה)' },
                { id: 'tx_imaging', label: 'דימות (ביצוע ותוצאות)' },
                { id: 'tx_consult', label: 'התייעצויות (מזמין, תחום, בדיקה)' }
            ],
            dispo: [
                { id: 'disp_plan', label: 'תוכנית והמלצות להמשך' },
                { id: 'disp_dest', label: 'יעד ברור מתועד' },
                { id: 'disp_time', label: 'שעת מעבר / שחרור' },
                { id: 'disp_sign', label: 'חתימת רופא / מנהל טיפול' }
            ],
            minor_specific: [
                { id: 'min_complaint', label: 'תלונה / אבחנה ראשונית' },
                { id: 'min_mental', label: 'אומדן / מצב נפשי' }
            ],
            or_specific: [
                { id: 'or_preop', label: 'מצב המטופל טרם ניתוח' },
                { id: 'or_handover', label: 'תיעוד העברת אחריות' }
            ]
        };

        const SITE_CONFIG = {
            triage: [...Q_BANK.id, ...Q_BANK.vitals, { id: 'tr_sort', label: 'סיווג נכון / קטגוריה' }, ...Q_BANK.dispo],
            trauma: [...Q_BANK.id, ...Q_BANK.abcd, ...Q_BANK.vitals, ...Q_BANK.revitals, ...Q_BANK.treatments, ...Q_BANK.dispo],
            immediate: [...Q_BANK.id, ...Q_BANK.vitals, ...Q_BANK.revitals, ...Q_BANK.treatments, ...Q_BANK.dispo],
            minor: [...Q_BANK.id, ...Q_BANK.minor_specific, ...Q_BANK.vitals, { id: 'min_tx', label: 'טיפול שניתן' }, ...Q_BANK.dispo],
            discharged: [...Q_BANK.id, { id: 'dc_diag', label: 'אבחנות בשחרור' }, { id: 'dc_exam', label: 'בדיקה גופנית' }, ...Q_BANK.minor_specific, ...Q_BANK.dispo],
            evac_wait: [...Q_BANK.id, ...Q_BANK.vitals, ...Q_BANK.revitals, { id: 'evc_tx', label: 'טיפול במהלך המתנה' }, { id: 'evc_handover', label: 'תיעוד מסירה לצוות מפנה' }],
            or: [...Q_BANK.id, ...Q_BANK.or_specific, ...Q_BANK.dispo],
            recovery: [...Q_BANK.id, ...Q_BANK.vitals, ...Q_BANK.revitals, { id: 'rec_events', label: 'אירועים חריגים' }, ...Q_BANK.dispo]
        };

        const ANSWERS = {
            VALID: { id: 'valid', label: '✓ תקין', score: 100, class: 'bg-emerald-50 text-emerald-700 border-emerald-500' },
            PARTIAL: { id: 'partial', label: '⚠ חלקי', score: 50, class: 'bg-amber-50 text-amber-700 border-amber-500' },
            MISSING: { id: 'missing', label: '✕ חסר', score: 0, class: 'bg-rose-50 text-rose-700 border-rose-500' },
            NA: { id: 'na', label: '— ל"ר', score: null, class: 'bg-gray-50 text-gray-600 border-gray-400' }
        };

        const COMMENT_LEVELS = [
            { id: 'info', label: 'מידע בלבד', color: 'text-blue-500' },
            { id: 'preserve', label: 'לשימור', color: 'text-emerald-500' },
            { id: 'improve', label: 'לשיפור', color: 'text-amber-500' },
            { id: 'significant', label: 'פער משמעותי', color: 'text-rose-500' },
            { id: 'critical', label: 'פער קריטי', color: 'text-rose-700 font-bold' }
        ];

        const generateId = () => Math.random().toString(36).substr(2, 9);
        const getFormatTime = () => {
            const d = new Date();
            return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
        };
        const getFormatDate = () => {
            const d = new Date();
            return d.getDate().toString().padStart(2, '0') + '/' + (d.getMonth() + 1).toString().padStart(2, '0') + '/' + d.getFullYear();
        };

        const ToastManager = {
            listeners: [],
            add: (msg, type = 'success') => ToastManager.listeners.forEach(l => l(msg, type)),
            subscribe: (l) => ToastManager.listeners.push(l)
        };

        const ToastContainer = () => {
            const [toasts, setToasts] = useState([]);
            useEffect(() => {
                ToastManager.subscribe((msg, type) => {
                    const id = generateId();
                    setToasts(prev => [...prev, { id, msg, type }]);
                    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
                });
            }, []);
            return (
                <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none w-[90%] max-w-sm">
                    {toasts.map(t => (
                        <div key={t.id} className={`fade-in px-4 py-3 rounded-2xl shadow-xl text-white font-bold text-sm text-center flex items-center justify-center gap-2
                            ${t.type === 'success' ? 'bg-medical-900 border border-medical-700' : t.type === 'error' ? 'bg-rose-600' : 'bg-medical-700'}`}>
                            {t.type === 'success' && <i className="fas fa-check-circle text-accent-500"></i>}
                            {t.msg}
                        </div>
                    ))}
                </div>
            );
        };

        const Button = ({ children, onClick, variant = 'primary', className = '', icon, full = false }) => {
            const base = "flex items-center justify-center gap-2 px-4 py-3 rounded-2xl font-bold transition-all duration-200 active:scale-95 shadow-sm";
            const variants = {
                primary: "bg-gradient-metallic text-white hover:shadow-glow-blue",
                secondary: "bg-medical-100 text-medical-900 hover:bg-medical-200",
                danger: "bg-rose-600 text-white hover:bg-rose-700 shadow-md",
                outline: "border-2 border-medical-200 text-medical-700 hover:border-medical-500 hover:bg-medical-50",
                ghost: "text-medical-700 hover:bg-gray-100",
                accent: "bg-gradient-accent text-white hover:shadow-glow-orange border border-accent-400"
            };
            return (
                <button onClick={onClick} className={`${base} ${variants[variant]} ${full ? 'w-full' : ''} ${className}`}>
                    {icon && <i className={`fas ${icon}`}></i>}
                    {children}
                </button>
            );
        };

        const ProgressBar = ({ percent }) => {
            let color = 'bg-rose-500';
            if (percent >= 75) color = 'bg-amber-400';
            if (percent >= 90) color = 'bg-emerald-500';
            return (
                <div className="w-full bg-gray-200 rounded-full h-2 mt-2 overflow-hidden shadow-inner">
                    <div className={`${color} h-2 rounded-full transition-all duration-500`} style={{ width: `${Math.max(0, percent)}%` }}></div>
                </div>
            );
        };

        const CommentModal = ({ isOpen, onClose, onSave, initialData, isCriticalMode = false }) => {
            const [text, setText] = useState('');
            const [level, setLevel] = useState('info');
            const [includeInReport, setIncludeInReport] = useState(true);
            const [isRecording, setIsRecording] = useState(false);

            useEffect(() => {
                if (isOpen) {
                    setText(initialData?.text || '');
                    setLevel(isCriticalMode ? 'critical' : (initialData?.level || 'info'));
                    setIncludeInReport(initialData?.includeInReport ?? true);
                }
            }, [isOpen, initialData, isCriticalMode]);

            const handleSpeech = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    ToastManager.add('הדפדפן אינו תומך בהכתבה קולית', 'error');
                    return;
                }
                try {
                    const recognition = new SpeechRecognition();
                    recognition.lang = 'he-IL';
                    recognition.onstart = () => setIsRecording(true);
                    recognition.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        setText(prev => prev + (prev ? ' ' : '') + transcript);
                    };
                    recognition.onerror = (event) => {
                        console.error("Speech recognition error:", event.error);
                        setIsRecording(false);
                        if (event.error !== 'no-speech') {
                            ToastManager.add('שגיאה בזיהוי קול', 'error');
                        }
                    };
                    recognition.onend = () => setIsRecording(false);
                    recognition.start();
                } catch (err) {
                    console.error("Speech start error:", err);
                    setIsRecording(false);
                }
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 bg-medical-900/60 z-50 flex items-center justify-center p-4 fade-in backdrop-blur-sm">
                    <div className="bg-white rounded-[2rem] w-full max-w-md flex flex-col max-h-[90vh] overflow-hidden shadow-2xl border border-white">
                        <div className={`p-5 text-white font-bold text-lg flex justify-between items-center ${isCriticalMode ? 'bg-rose-600' : 'bg-gradient-metallic'}`}>
                            <span>{isCriticalMode ? '🚩 סימון פער קריטי' : '📝 הוספת הערה'}</span>
                            <button onClick={onClose} className="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center hover:bg-white/30 transition-colors"><i className="fas fa-times"></i></button>
                        </div>
                        <div className="p-5 flex-1 overflow-y-auto space-y-5">
                            <div className="relative">
                                <textarea
                                    className="w-full border-2 border-gray-200 rounded-2xl p-4 h-32 focus:border-accent-500 focus:ring-0 resize-none bg-gray-50 text-medical-900 font-medium"
                                    placeholder="הקלד או תכתיב הערה..."
                                    value={text}
                                    onChange={e => setText(e.target.value)}
                                ></textarea>
                                <button onClick={handleSpeech} className={`absolute bottom-3 left-3 p-3 rounded-xl shadow-sm transition-all ${isRecording ? 'bg-rose-500 text-white animate-pulse' : 'bg-white text-medical-500 hover:bg-medical-50 border border-gray-200'}`}>
                                    <i className="fas fa-microphone"></i>
                                </button>
                            </div>

                            {!isCriticalMode && (
                                <div>
                                    <label className="block text-sm font-bold text-medical-900 mb-3">סיווג הערה</label>
                                    <div className="grid grid-cols-2 gap-3">
                                        {COMMENT_LEVELS.map(l => (
                                            <button key={l.id} onClick={() => setLevel(l.id)}
                                                className={`p-3 rounded-xl text-sm border-2 font-bold transition-all ${level === l.id ? 'bg-medical-50 border-medical-500 shadow-sm' : 'border-gray-100 hover:bg-gray-50 text-gray-500'}`}>
                                                <span className={level === l.id ? l.color : ''}>{l.label}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            <label className="flex items-center gap-3 p-4 bg-gray-50 rounded-xl cursor-pointer border border-gray-100">
                                <input type="checkbox" checked={includeInReport} onChange={e => setIncludeInReport(e.target.checked)} className="w-5 h-5 text-accent-500 rounded border-gray-300 focus:ring-accent-500" />
                                <span className="text-medical-900 font-bold text-sm">הצג הערה בדו״ח הסופי</span>
                            </label>
                        </div>
                        <div className="p-5 border-t bg-gray-50 flex gap-3">
                            <Button variant="outline" className="flex-1" onClick={onClose}>ביטול</Button>
                            <Button variant="accent" className={`flex-1 ${isCriticalMode ? '!bg-rose-600 !border-rose-700 !shadow-none' : ''}`} onClick={() => {
                                onSave({ text, level, includeInReport, timestamp: getFormatTime(), date: getFormatDate() });
                                onClose();
                            }}>שמור הערה</Button>
                        </div>
                    </div>
                </div>
            );
        };

        const ViewLogin = ({ onStart }) => {
            const [name, setName] = useState('');
            const [drillName, setDrillName] = useState('');
            const today = getFormatDate();
            
            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-animated-gradient relative overflow-hidden">
                    {/* Abstract background shapes */}
                    <div className="absolute top-10 left-10 w-64 h-64 bg-medical-100 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-pulse"></div>
                    <div className="absolute bottom-10 right-10 w-72 h-72 bg-accent-100 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse" style={{ animationDelay: '2s' }}></div>

                    <div className="bg-white/80 backdrop-blur-xl rounded-[2.5rem] shadow-2xl w-full max-w-md overflow-hidden fade-in border border-white/50 relative z-10">
                        {}
                        <div className="p-8 text-center relative overflow-hidden bg-gradient-to-br from-medical-900 to-medical-700">
                            {/* Decorative background elements in header */}
                            <div className="absolute top-0 right-0 w-40 h-40 bg-accent-500 rounded-full blur-[60px] opacity-40 transform translate-x-1/2 -translate-y-1/2"></div>
                            <div className="absolute bottom-0 left-0 w-32 h-32 bg-medical-500 rounded-full blur-[40px] opacity-40 transform -translate-x-1/2 translate-y-1/2"></div>
                            
                            {/* Ziv Logo */}
                            <div className="mb-6 flex justify-center relative z-10 float-anim">
                                <div className="bg-white/10 backdrop-blur-md p-4 rounded-3xl shadow-[0_8px_30px_rgba(0,0,0,0.12)] border border-white/20">
                                    <img src="ziv-logo-updated.png.png" alt="המרכז הרפואי זיו" className="h-16 object-contain" onError={(e) => { e.target.onerror = null; e.target.src = 'https://placehold.co/200x80/transparent/ffffff?text=Ziv+Medical'; }} />
                                </div>
                            </div>

                            <h1 className="text-4xl font-black mb-2 flex justify-center items-center gap-2 tracking-tight relative z-10 text-white">
                                ניטור ובקרת <span className="text-accent-400 drop-shadow-[0_0_10px_rgba(250,128,66,0.8)]">תיעוד</span>
                            </h1>
                            <p className="text-medical-50 font-medium opacity-90 text-sm relative z-10 tracking-wide">בקרת איכות תיעוד בזמן אמת</p>
                        </div>
                        
                        {}
                        <div className="p-7 space-y-6 bg-white/50">
                            <div>
                                <label className="block text-sm font-bold text-medical-900 mb-2 ml-1">שם הבקר/ת <span className="text-accent-500">*</span></label>
                                <div className="relative group">
                                    <i className="fas fa-user-md absolute right-4 top-1/2 transform -translate-y-1/2 text-medical-400 group-focus-within:text-accent-500 transition-colors text-lg"></i>
                                    <input type="text" className="w-full border-2 border-medical-100 bg-white/70 rounded-2xl py-4 pl-4 pr-12 focus:bg-white focus:border-accent-400 focus:ring-4 focus:ring-accent-500/10 transition-all text-medical-900 font-bold shadow-sm" 
                                        value={name} onChange={e => setName(e.target.value)} placeholder="הזן שם מלא..." />
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-medical-900 mb-2 ml-1">שם התרגיל <span className="text-gray-400 font-normal">(אופציונלי)</span></label>
                                <div className="relative group">
                                    <i className="fas fa-shield-alt absolute right-4 top-1/2 transform -translate-y-1/2 text-medical-400 group-focus-within:text-accent-500 transition-colors text-lg"></i>
                                    <input type="text" className="w-full border-2 border-medical-100 bg-white/70 rounded-2xl py-4 pl-4 pr-12 focus:bg-white focus:border-accent-400 focus:ring-4 focus:ring-accent-500/10 transition-all text-medical-900 font-bold shadow-sm" 
                                        value={drillName} onChange={e => setDrillName(e.target.value)} placeholder="לדוגמה: מגן זהב 2026..." />
                                </div>
                            </div>
                            
                            {}
                            <div className="grid grid-cols-2 gap-3 pt-2">
                                <div className="bg-gradient-to-br from-medical-50 to-white p-4 rounded-2xl border border-medical-100 flex flex-col items-center justify-center shadow-sm">
                                    <i className="far fa-calendar-alt text-accent-500 mb-2 text-xl drop-shadow-sm"></i>
                                    <span className="font-bold text-medical-900 text-sm tracking-wide">{today}</span>
                                </div>
                                <div className="bg-gradient-to-br from-medical-50 to-white p-4 rounded-2xl border border-medical-100 flex flex-col items-center justify-center shadow-sm">
                                    <i className="far fa-clock text-accent-500 mb-2 text-xl drop-shadow-sm"></i>
                                    <span className="font-bold text-medical-900 text-sm tracking-wide">{getFormatTime()}</span>
                                </div>
                            </div>
                            
                            {}
                            <Button full icon="fa-play" className="mt-8 py-4 text-lg font-black tracking-wide pulse-soft !bg-gradient-to-r !from-accent-500 !to-accent-400 hover:!from-accent-600 hover:!to-accent-500 !shadow-[0_8px_20px_rgba(245,99,27,0.3)] hover:!shadow-[0_12px_25px_rgba(245,99,27,0.4)]" variant="accent"
                                onClick={() => {
                                    if(!name) { ToastManager.add('יש להזין שם בקר', 'error'); return; }
                                    onStart({ auditor: name, drillName, date: today, startTime: getFormatTime() });
                                }}>
                                התחל בקרה
                            </Button>
                        </div>
                    </div>
                </div>
            );
        };

        const ViewDashboard = ({ drillInfo, audits, onSelectSite, onFinishDrill }) => {
            
            const calcSiteStats = (siteId) => {
                const siteAudits = audits.filter(a => a.site === siteId);
                const count = siteAudits.length;
                let totalScore = 0;
                let criticalCount = 0;
                let significantCount = 0;

                siteAudits.forEach(a => {
                    totalScore += a.score;
                    a.comments.forEach(c => {
                        if (c.level === 'critical') criticalCount++;
                        if (c.level === 'significant') significantCount++;
                    });
                });

                const avgScore = count ? Math.round(totalScore / count) : 0;
                return { count, avgScore, criticalCount, significantCount };
            };

            const getRecurringGaps = () => {
                let gaps = {};
                audits.forEach(a => {
                    Object.keys(a.answers).forEach(qId => {
                        const ans = a.answers[qId];
                        if (ans && (ans.val === 'missing' || ans.val === 'partial')) {
                            const key = `${a.site}_${qId}`;
                            if(!gaps[key]) gaps[key] = { count: 0, total: 0, site: a.site, qId };
                            gaps[key].count++;
                        }
                        const key = `${a.site}_${qId}`;
                        if(gaps[key]) gaps[key].total++;
                    });
                });
                
                return Object.values(gaps).filter(g => g.count >= 2).map(g => {
                    const siteName = SITES.find(s=>s.id === g.site).name;
                    let qLabel = g.qId;
                    for(const sec in Q_BANK) {
                        const q = Q_BANK[sec].find(x => x.id === g.qId);
                        if (q) qLabel = q.label;
                    }
                    return { ...g, siteName, qLabel };
                });
            };

            const recurring = getRecurringGaps();

            return (
                <div className="pb-24 fade-in">
                    {/* Header */}
                    <div className="bg-gradient-metallic text-white pt-8 pb-10 px-6 rounded-b-[2.5rem] shadow-lg relative overflow-hidden">
                         <div className="absolute top-0 left-0 w-full h-full bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10 mix-blend-overlay"></div>
                         <div className="absolute -top-10 -right-10 w-40 h-40 bg-accent-500 rounded-full blur-3xl opacity-30"></div>
                        
                        <div className="flex justify-between items-start mb-6 relative z-10">
                            <div>
                                <h2 className="text-3xl font-black mb-1 tracking-tight">תמונת מצב</h2>
                                <div className="flex items-center gap-2 text-medical-100 text-sm font-medium">
                                    <span className="bg-white/10 px-2.5 py-1 rounded-lg backdrop-blur-sm border border-white/10">{drillInfo.drillName || 'תרגיל'}</span>
                                    <span>•</span>
                                    <span>{drillInfo.auditor}</span>
                                </div>
                            </div>
                            <div className="text-center bg-white/10 px-5 py-3 rounded-2xl backdrop-blur-md border border-white/20 shadow-[0_4px_15px_rgba(0,0,0,0.1)]">
                                <span className="block text-4xl font-black text-accent-400">{audits.length}</span>
                                <span className="text-[10px] font-bold uppercase tracking-wider text-white/80">גיליונות נבדקו</span>
                            </div>
                        </div>
                    </div>

                    {/* Recurring Gaps Banner */}
                    {recurring.length > 0 && (
                        <div className="mx-5 -mt-6 relative z-20 bg-white border-l-4 border-rose-500 rounded-2xl p-4 shadow-lg mb-6">
                            <h3 className="text-medical-900 font-bold flex items-center gap-2 mb-2"><i className="fas fa-exclamation-triangle text-rose-500"></i> פערים חוזרים שזוהו</h3>
                            <ul className="text-sm space-y-2 text-gray-600">
                                {recurring.slice(0, 3).map((r, i) => (
                                    <li key={i} className="flex items-start gap-2">
                                        <span className="text-rose-500 mt-0.5">•</span>
                                        <span>ב-<span className="font-bold text-medical-900">{r.siteName}</span>: {r.count} מתוך {r.total} גיליונות ללא {r.qLabel}</span>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    )}

                    {/* Sites Grid */}
                    <div className={`p-5 grid grid-cols-1 md:grid-cols-2 gap-4 ${recurring.length === 0 ? 'mt-4' : ''}`}>
                        {SITES.map(site => {
                            const stats = calcSiteStats(site.id);
                            return (
                                <div key={site.id} onClick={() => onSelectSite(site.id)}
                                    className="bg-card-gloss rounded-[2rem] shadow-sm border border-white p-5 cursor-pointer hover:shadow-xl transition-all duration-300 hover:-translate-y-1 active:scale-[0.98] group relative overflow-hidden">
                                    <div className="flex justify-between items-start mb-4 relative z-10">
                                        <div className="flex items-center gap-4">
                                            <div className="w-14 h-14 rounded-2xl bg-medical-50 flex items-center justify-center text-medical-700 text-2xl shadow-inner group-hover:bg-accent-500 group-hover:text-white transition-colors duration-300 border border-medical-100 group-hover:border-accent-400">
                                                <i className={`fas ${site.icon}`}></i>
                                            </div>
                                            <h3 className="font-black text-lg text-medical-900">{site.name}</h3>
                                        </div>
                                        <div className="text-center min-w-[3rem]">
                                            <span className="text-[10px] uppercase font-bold text-gray-400 block mb-0.5">נבדקו</span>
                                            <span className="font-black text-2xl text-medical-700">{stats.count}</span>
                                        </div>
                                    </div>
                                    
                                    {stats.count > 0 ? (
                                        <div className="relative z-10">
                                            <div className="flex justify-between text-sm mb-1.5">
                                                <span className="text-gray-500 font-medium">שלמות תיעוד</span>
                                                <span className="font-black text-medical-900">{stats.avgScore}%</span>
                                            </div>
                                            <ProgressBar percent={stats.avgScore} />
                                            <div className="flex gap-4 mt-4 pt-3 border-t border-gray-100/50 text-xs">
                                                {stats.criticalCount > 0 && <span className="text-rose-600 font-bold bg-rose-50 px-2 py-1 rounded-md"><i className="fas fa-flag"></i> {stats.criticalCount} קריטי</span>}
                                                {stats.significantCount > 0 && <span className="text-amber-600 font-bold bg-amber-50 px-2 py-1 rounded-md"><i className="fas fa-exclamation-circle"></i> {stats.significantCount} משמעותי</span>}
                                                {stats.criticalCount === 0 && stats.significantCount === 0 && <span className="text-emerald-600 font-bold bg-emerald-50 px-2 py-1 rounded-md"><i className="fas fa-check-circle"></i> תקין</span>}
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="mt-4 text-center text-gray-400 text-sm py-3 bg-gray-50/50 rounded-xl border border-dashed border-gray-200">טרם נבדקו גיליונות</div>
                                    )}
                                </div>
                            );
                        })}
                    </div>

                    <div className="p-5 mt-4">
                        <Button full variant="outline" icon="fa-flag-checkered" className="py-4 border-dashed border-2 hover:border-solid hover:bg-medical-900 hover:text-white hover:border-medical-900 transition-all text-lg" onClick={onFinishDrill}>
                            סיים תרגיל והפק דו״ח
                        </Button>
                    </div>
                </div>
            );
        };

        const ViewAudit = ({ siteId, drillInfo, existingAudit, onSave, onBack }) => {
            const site = SITES.find(s => s.id === siteId);
            const questions = SITE_CONFIG[siteId];
            
            const [sheetCode, setSheetCode] = useState(existingAudit?.sheetCode || '');
            const [answers, setAnswers] = useState(existingAudit?.answers || {});
            const [comments, setComments] = useState(existingAudit?.comments || []);
            const [activeCommentItem, setActiveCommentItem] = useState(null);
            
            const handleAnswer = (qId, val) => {
                setAnswers(prev => ({ ...prev, [qId]: { val, timestamp: getFormatTime() } }));
                ToastManager.add('נשמר', 'success');
            };

            const calculateScore = () => {
                let total = 0, potential = 0;
                questions.forEach(q => {
                    const ans = answers[q.id]?.val;
                    if (ans && ans !== 'na') {
                        potential += 100;
                        if (ans === 'valid') total += 100;
                        if (ans === 'partial') total += 50;
                    }
                });
                return potential === 0 ? 0 : Math.round((total / potential) * 100);
            };

            const saveAndExit = () => {
                if (!sheetCode) { ToastManager.add('יש להזין זיהוי גיליון', 'error'); return; }
                onSave({
                    id: existingAudit?.id || generateId(),
                    site: siteId,
                    sheetCode,
                    answers,
                    comments,
                    score: calculateScore(),
                    timestamp: existingAudit?.timestamp || getFormatTime(),
                    auditor: drillInfo.auditor
                });
            };

            const answeredCount = Object.keys(answers).length;
            const progress = Math.round((answeredCount / questions.length) * 100);

            return (
                <div className="pb-24 bg-gray-50 min-h-screen">
                    <div className="sticky top-0 z-40 bg-white/90 backdrop-blur-xl border-b border-gray-100 shadow-sm">
                        <div className="flex justify-between items-center p-4">
                            <button onClick={onBack} className="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center text-medical-900 hover:bg-medical-50 transition-colors border border-gray-100"><i className="fas fa-arrow-right"></i></button>
                            <div className="text-center flex-1">
                                <h2 className="font-black text-xl text-medical-900 tracking-tight">{site.name}</h2>
                                <span className="text-[11px] font-bold text-accent-500 uppercase tracking-wider bg-accent-50 px-3 py-1 rounded-full inline-block mt-1">בדיקת גיליון</span>
                            </div>
                            <div className="w-10"></div>
                        </div>
                        <div className="px-5 pb-3">
                            <div className="flex justify-between text-xs font-bold text-gray-500 mb-2">
                                <span>התקדמות בדיקה</span>
                                <span>{progress}%</span>
                            </div>
                            <div className="w-full bg-gray-100 rounded-full h-2.5 overflow-hidden">
                                <div className="bg-gradient-accent h-2.5 rounded-full transition-all duration-500 ease-out" style={{width: `${progress}%`}}></div>
                            </div>
                        </div>
                    </div>

                    <div className="p-4 space-y-5">
                        <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-3 h-full bg-accent-500"></div>
                            <label className="block text-sm font-bold text-medical-900 mb-3">מספר גיליון / קוד מדגם *</label>
                            <input type="text" className="w-full border-2 border-gray-100 rounded-2xl p-4 text-2xl font-black text-center focus:border-accent-500 bg-gray-50 text-medical-900 transition-colors shadow-inner" 
                                value={sheetCode} onChange={e => setSheetCode(e.target.value)} placeholder="הזן זיהוי..." />
                        </div>

                        {}
                        {questions.map((q, idx) => {
                            const currentAns = answers[q.id]?.val;
                            const itemComments = comments.filter(c => c.qId === q.id);
                            const hasCritical = itemComments.some(c => c.level === 'critical');

                            return (
                                <div key={q.id} className={`bg-white rounded-[2rem] shadow-sm border-2 p-5 transition-all duration-300 ${currentAns ? 'border-medical-200 bg-medical-50/30' : 'border-white'}`}>
                                    
                                    <div className="flex justify-between items-start mb-4">
                                        <h3 className="font-bold text-medical-900 pr-1 text-base leading-snug"><span className="text-accent-500 font-black mr-1">{idx + 1}.</span> {q.label}</h3>
                                        <div className="flex gap-2">
                                            <button onClick={() => setActiveCommentItem({qId: q.id, isCritical: false})} 
                                                className={`p-2 rounded-full text-sm transition-colors ${itemComments.length ? 'bg-medical-100 text-medical-700' : 'text-gray-400 hover:bg-gray-100'}`}>
                                                <i className="fas fa-comment-medical"></i>
                                            </button>
                                            <button onClick={() => setActiveCommentItem({qId: q.id, isCritical: true})} 
                                                className={`p-2 rounded-full text-sm transition-colors ${hasCritical ? 'bg-rose-100 text-rose-600 shadow-inner' : 'text-gray-300 hover:text-rose-500 hover:bg-rose-50'}`}>
                                                <i className="fas fa-flag"></i>
                                            </button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-4 gap-2">
                                        {Object.values(ANSWERS).map(ans => {
                                            const isSelected = currentAns === ans.id;
                                            return (
                                                <button key={ans.id} onClick={() => handleAnswer(q.id, ans.id)}
                                                    className={`py-3 rounded-xl text-sm border-2 font-bold transition-all duration-200 flex flex-col items-center justify-center gap-1
                                                    ${isSelected ? ans.class + ' shadow-sm scale-[0.98]' : 'border-gray-100 bg-white text-gray-500 hover:bg-gray-50 hover:border-gray-200'}`}>
                                                    <span className="text-xl mb-1">{ans.label.split(' ')[0]}</span>
                                                    <span className="text-[10px] leading-tight">{ans.label.substring(2)}</span>
                                                </button>
                                            );
                                        })}
                                    </div>

                                    {itemComments.length > 0 && (
                                        <div className="mt-4 bg-gray-50 rounded-xl p-3 border border-gray-100 space-y-2">
                                            {itemComments.map((c, i) => (
                                                <div key={i} className="text-sm font-medium text-gray-700 flex items-start gap-2">
                                                    <span className={COMMENT_LEVELS.find(l=>l.id===c.level)?.color || ''}>
                                                        {c.level === 'critical' ? '🚩' : '📝'} 
                                                    </span>
                                                    <span>{c.text}</span>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            );
                        })}

                        <div className="bg-medical-50 p-6 rounded-[2rem] border-2 border-dashed border-medical-200 text-center hover:bg-medical-100 transition-colors cursor-pointer group" onClick={() => setActiveCommentItem({qId: 'general', isCritical: false})}>
                            <div className="w-12 h-12 rounded-full bg-white shadow-sm flex items-center justify-center mx-auto mb-3 text-medical-500 group-hover:scale-110 group-hover:text-accent-500 transition-all">
                                <i className="fas fa-plus"></i>
                            </div>
                            <span className="text-medical-900 font-bold">הוסף הערה כללית לגיליון זה</span>
                        </div>
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur-xl border-t border-gray-100 flex gap-3 z-30 pb-safe shadow-[0_-10px_40px_-10px_rgba(0,0,0,0.1)]">
                        <Button variant="outline" className="w-1/3 bg-white" onClick={onBack}>ביטול</Button>
                        <Button variant="accent" className="w-2/3" onClick={saveAndExit}>שמור וסיים</Button>
                    </div>

                    <CommentModal 
                        isOpen={!!activeCommentItem} 
                        isCriticalMode={activeCommentItem?.isCritical}
                        onClose={() => setActiveCommentItem(null)}
                        onSave={(commentData) => {
                            setComments(prev => [...prev, { ...commentData, qId: activeCommentItem.qId }]);
                            ToastManager.add('הערה נשמרה');
                        }}
                    />
                </div>
            );
        };

        const ViewSummary = ({ drillInfo, audits, onBack }) => {
            const [showEmail, setShowEmail] = useState(false);
            const [emails, setEmails] = useState([]);
            const [emailInput, setEmailInput] = useState('');
            const [summaryText, setSummaryText] = useState('');
            const reportRef = useRef();

            useEffect(() => {
                const totalSheets = audits.length;
                const uniqueSites = new Set(audits.map(a => a.site)).size;
                const overallScore = totalSheets ? Math.round(audits.reduce((acc, curr) => acc + curr.score, 0) / totalSheets) : 0;
                let criticalGaps = 0, significantGaps = 0, strengths = [];

                audits.forEach(a => {
                    a.comments.forEach(c => {
                        if(c.level === 'critical') criticalGaps++;
                        if(c.level === 'significant') significantGaps++;
                        if(c.level === 'preserve') strengths.push(c.text);
                    });
                });

                let text = `בוצע ניטור ובקרת תיעוד.\nנבדקו בסך הכל ${totalSheets} גיליונות ב-${uniqueSites} אתרי טיפול.\nציון השלמות הכולל הינו ${overallScore}%.\n\n`;
                if (criticalGaps > 0) text += `⚠️ אותרו ${criticalGaps} פערים קריטיים הדורשים התייחסות מיידית.\n`;
                if (significantGaps > 0) text += `אותרו ${significantGaps} פערים משמעותיים.\n\n`;
                if (strengths.length > 0) {
                    text += `נקודות לשימור:\n`;
                    [...new Set(strengths)].slice(0, 3).forEach(s => text += `- ${s}\n`);
                }
                setSummaryText(text);
            }, [audits]);

            const generatePDF = async () => {
                ToastManager.add('מפיק קובץ PDF...', 'info');
                const element = reportRef.current;
                const opt = {
                    margin: 10,
                    filename: `דוח_ניטור_ובקרת_תיעוד_${drillInfo.date.replace(/\//g,'-')}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                
                try {
                    await html2pdf().set(opt).from(element).save();
                    ToastManager.add('קובץ נשמר בהצלחה', 'success');
                } catch (err) {
                    console.error('PDF Generation Error:', err);
                    ToastManager.add('שגיאה בהפקת הקובץ. ייתכן שיש חסימה בדפדפן.', 'error');
                }
            };

            const handleEmailAdd = (e) => {
                if (e.key === 'Enter' || e.key === ',') {
                    e.preventDefault();
                    const val = emailInput.trim().replace(',', '');
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (emailRegex.test(val) && !emails.includes(val)) {
                        setEmails([...emails, val]); setEmailInput('');
                    } else if (val) { ToastManager.add('כתובת אימייל לא חוקית', 'error'); }
                }
            };

            const sendEmail = () => {
                if(emails.length === 0) { ToastManager.add('יש להזין לפחות נמען אחד', 'error'); return; }
                
                ToastManager.add('פותח תוכנת דואר...', 'info');
                
                // בניית הנמענים והנושא
                const to = emails.join(',');
                const subject = encodeURIComponent(`דוח בקרת תיעוד - ${drillInfo.drillName || 'תרגיל'} - ${drillInfo.date}`);
                
                const totalSheets = audits.length;
                const overallScore = totalSheets ? Math.round(audits.reduce((a,b)=>a+b.score,0)/totalSheets) : 0;
                
                // בניית גוף המייל כטקסט פשוט ומסודר
                let bodyText = `דוח בקרת גיליונות - ניטור ובקרת תיעוד\n\n`;
                bodyText += `שם התרגיל: ${drillInfo.drillName || 'לא צוין'}\n`;
                bodyText += `תאריך: ${drillInfo.date}\n`;
                bodyText += `בקר/ת: ${drillInfo.auditor}\n\n`;
                
                bodyText += `--- נתונים מדדיים ---\n`;
                bodyText += `גיליונות שנבדקו: ${totalSheets}\n`;
                bodyText += `ציון שלמות כוללת: ${overallScore}%\n\n`;
                
                bodyText += `--- סיכום מנהלים ---\n`;
                bodyText += `${summaryText}\n\n`;
                
                bodyText += `--- פירוט הערות לדו"ח ---\n`;
                const reportComments = audits.flatMap(a => a.comments.map(c => ({...c, site: a.site, sheetCode: a.sheetCode}))).filter(c => c.includeInReport);
                
                if(reportComments.length > 0) {
                    reportComments.forEach(c => {
                        const siteName = SITES.find(s=>s.id===c.site)?.name || 'לא ידוע';
                        const levelLabel = COMMENT_LEVELS.find(l=>l.id===c.level)?.label || '';
                        bodyText += `[${siteName} | גיליון ${c.sheetCode}] ${levelLabel}: ${c.text}\n`;
                    });
                } else {
                    bodyText += `לא צוינו הערות מפורטות.\n`;
                }
                
                bodyText += `\n\n* הופק באמצעות מערכת אר"ן Control *`;

                const body = encodeURIComponent(bodyText);
                const mailtoLink = `mailto:${to}?subject=${subject}&body=${body}`;

                // בדיקת מגבלת אורך של דפדפנים עבור mailto (בסביבות 2000-2500 תווים)
                if (mailtoLink.length > 2500) {
                    ToastManager.add('הדוח ארוך מדי לשליחה ישירה. אנא הפק PDF וצרף למייל ידנית.', 'error');
                    return;
                }

                // פתיחת אפליקציית המייל המקומית של המשתמש
                window.location.href = mailtoLink;
                
                // סגירת חלונית המייל לאחר הפתיחה
                setTimeout(() => {
                    setShowEmail(false); 
                    setEmails([]);
                }, 1000);
            };

            return (
                <div className="pb-24 fade-in min-h-screen bg-gray-50">
                    <div className="bg-gradient-metallic text-white p-5 sticky top-0 z-40 flex items-center justify-between shadow-md">
                        <button onClick={onBack} className="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition-colors"><i className="fas fa-arrow-right"></i></button>
                        <h2 className="font-bold text-lg tracking-wide">סיכום והפקת דוח</h2>
                        <div className="w-10"></div>
                    </div>

                    <div className="p-4" >
                        <div ref={reportRef} className="bg-white p-8 rounded-[2rem] shadow-sm border border-gray-100" style={{direction: 'rtl'}}>
                            <div className="border-b-2 border-medical-100 pb-6 mb-6 text-center">
                                 {/* Ziv Logo in PDF */}
                                 <div className="mb-4 flex justify-center">
                                    <img src="ziv-logo-updated.png.png" alt="המרכז הרפואי זיו" className="h-20 object-contain" onError={(e) => { e.target.onerror = null; e.target.src = 'https://placehold.co/200x80/transparent/103058?text=Ziv+Medical'; }} />
                                </div>
                                <h1 className="text-3xl font-black text-medical-900 mb-2">דוח בקרת גיליונות</h1>
                                <p className="text-accent-500 font-bold text-xl">{drillInfo.drillName || 'תרגיל'}</p>
                                <p className="text-gray-500 text-sm mt-2">{drillInfo.date} • בקר/ת: {drillInfo.auditor}</p>
                            </div>

                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                                <div className="bg-medical-50 p-5 rounded-2xl text-center border border-medical-100">
                                    <span className="block text-4xl font-black text-medical-900">{audits.length}</span>
                                    <span className="text-sm font-bold text-medical-900/60 mt-2 block">גיליונות נבדקו</span>
                                </div>
                                <div className="bg-emerald-50 p-5 rounded-2xl text-center border border-emerald-100">
                                    <span className="block text-4xl font-black text-emerald-600">
                                        {audits.length ? Math.round(audits.reduce((a,b)=>a+b.score,0)/audits.length) : 0}%
                                    </span>
                                    <span className="text-sm font-bold text-emerald-900/60 mt-2 block">שלמות כוללת</span>
                                </div>
                                <div className="bg-amber-50 p-5 rounded-2xl text-center border border-amber-100">
                                    <span className="block text-4xl font-black text-amber-600">
                                        {audits.reduce((acc, a) => acc + a.comments.filter(c=>c.level==='significant').length, 0)}
                                    </span>
                                    <span className="text-sm font-bold text-amber-900/60 mt-2 block">פערים משמעותיים</span>
                                </div>
                                <div className="bg-rose-50 p-5 rounded-2xl text-center border border-rose-100">
                                    <span className="block text-4xl font-black text-rose-600">
                                        {audits.reduce((acc, a) => acc + a.comments.filter(c=>c.level==='critical').length, 0)}
                                    </span>
                                    <span className="text-sm font-bold text-rose-900/60 mt-2 block">פערים קריטיים</span>
                                </div>
                            </div>

                            <div className="mb-8">
                                <h3 className="font-bold text-lg text-medical-900 border-b-2 border-accent-500 inline-block pb-1 mb-4">סיכום מילולי מנהלים</h3>
                                <textarea className="w-full h-40 p-4 border-2 border-gray-100 rounded-2xl bg-gray-50 text-base focus:bg-white transition-colors font-medium text-medical-900" 
                                    value={summaryText} onChange={e=>setSummaryText(e.target.value)}></textarea>
                            </div>

                            <div>
                                <h3 className="font-bold text-lg text-medical-900 border-b-2 border-accent-500 inline-block pb-1 mb-4"><i className="fas fa-list-ul text-accent-500 ml-2"></i>פירוט הערות לדו״ח</h3>
                                <div className="space-y-4">
                                    {audits.flatMap(a => a.comments.map(c => ({...c, site: a.site, sheetCode: a.sheetCode})))
                                        .filter(c => c.includeInReport)
                                        .map((c, i) => (
                                            <div key={i} className={`p-5 rounded-2xl border-r-4 text-sm bg-gray-50 
                                                ${c.level === 'critical' ? 'border-r-rose-500 shadow-[inset_0_0_0_1px_rgba(244,63,94,0.1)]' : 
                                                  c.level === 'significant' ? 'border-r-amber-400 shadow-[inset_0_0_0_1px_rgba(251,191,36,0.1)]' : 
                                                  'border-r-medical-300 shadow-[inset_0_0_0_1px_rgba(0,0,0,0.05)]'}`}>
                                                <div className="flex justify-between items-center text-xs font-bold text-gray-500 mb-2">
                                                    <span className="bg-white px-3 py-1 rounded-lg shadow-sm border border-gray-100 text-medical-900">{SITES.find(s=>s.id===c.site)?.name} | גיליון {c.sheetCode}</span>
                                                    <span className={`${COMMENT_LEVELS.find(l=>l.id===c.level)?.color} flex items-center gap-1`}>
                                                        {c.level === 'critical' && <i className="fas fa-flag"></i>}
                                                        {COMMENT_LEVELS.find(l=>l.id===c.level)?.label}
                                                    </span>
                                                </div>
                                                <p className="text-gray-800 text-base font-medium">{c.text}</p>
                                            </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {showEmail && (
                        <div className="fixed inset-0 bg-medical-900/60 z-50 flex items-end sm:items-center justify-center fade-in backdrop-blur-sm">
                            <div className="bg-white w-full sm:max-w-md sm:rounded-[2rem] rounded-t-[2rem] p-6 shadow-2xl">
                                <div className="flex justify-between items-center mb-5">
                                    <h3 className="font-black text-xl text-medical-900"><i className="fas fa-paper-plane text-accent-500 ml-2"></i> שליחת דוח</h3>
                                    <button onClick={() => setShowEmail(false)} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500"><i className="fas fa-times"></i></button>
                                </div>
                                
                                <div className="mb-5">
                                    <label className="block text-sm font-bold text-medical-900 mb-2">אל:</label>
                                    <div className="min-h-[56px] border-2 border-gray-200 rounded-2xl p-2 flex flex-wrap gap-2 focus-within:border-accent-500 bg-gray-50 transition-colors">
                                        {emails.map((e,i) => (
                                            <span key={i} className="bg-medical-100 text-medical-900 text-sm font-bold px-3 py-1.5 rounded-xl flex items-center gap-2">
                                                {e} <button onClick={()=>setEmails(emails.filter((_,idx)=>idx!==i))} className="text-medical-500 hover:text-rose-600"><i className="fas fa-times"></i></button>
                                            </span>
                                        ))}
                                        <input type="email" value={emailInput} onChange={e=>setEmailInput(e.target.value)} onKeyDown={handleEmailAdd}
                                            placeholder={emails.length === 0 ? "הקלד כתובת ולחץ Enter..." : ""} 
                                            className="flex-1 min-w-[120px] bg-transparent outline-none text-sm font-medium" dir="ltr" />
                                    </div>
                                    <p className="text-xs text-gray-500 mt-2 font-medium">לחץ Enter או הוסף פסיק להוספת נמענים נוספים.</p>
                                </div>
                                <Button full icon="fa-envelope" className="py-4 text-lg" variant="accent" onClick={sendEmail}>שלח דוח כעת</Button>
                            </div>
                        </div>
                    )}

                    <div className="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur-xl border-t border-gray-100 flex gap-3 z-30 pb-safe shadow-[0_-10px_40px_-10px_rgba(0,0,0,0.1)]">
                        <Button variant="primary" className="flex-1" icon="fa-file-pdf" onClick={generatePDF}>PDF</Button>
                        <Button variant="accent" className="flex-1" icon="fa-envelope" onClick={() => setShowEmail(true)}>שלח למייל</Button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('login'); 
            const [drillInfo, setDrillInfo] = useState(null);
            const [audits, setAudits] = useState([]);
            const [activeSite, setActiveSite] = useState(null);

            useEffect(() => {
                const saved = localStorage.getItem('aranControlStateV2');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed.drillInfo) setDrillInfo(parsed.drillInfo);
                        if (parsed.audits) setAudits(parsed.audits);
                        if (parsed.drillInfo) setView('dashboard');
                    } catch(e) { console.error("Could not load state"); }
                }
            }, []);

            useEffect(() => {
                if (drillInfo) localStorage.setItem('aranControlStateV2', JSON.stringify({ drillInfo, audits }));
            }, [drillInfo, audits]);

            const handleSaveAudit = (auditData) => {
                setAudits(prev => {
                    const existingIdx = prev.findIndex(a => a.id === auditData.id);
                    if (existingIdx >= 0) {
                        const newAudits = [...prev];
                        newAudits[existingIdx] = auditData;
                        return newAudits;
                    }
                    return [...prev, auditData];
                });
                setView('dashboard');
            };

            return (
                <div className="antialiased text-gray-900 font-sans max-w-2xl mx-auto shadow-2xl relative min-h-screen bg-white selection:bg-accent-500 selection:text-white">
                    <ToastContainer />
                    
                    {view === 'login' && <ViewLogin onStart={(info) => { setDrillInfo(info); setView('dashboard'); }} />}
                    
                    {view === 'dashboard' && (
                        <ViewDashboard 
                            drillInfo={drillInfo} audits={audits} 
                            onSelectSite={(siteId) => { setActiveSite(siteId); setView('audit'); }}
                            onFinishDrill={() => setView('summary')}
                        />
                    )}
                    
                    {view === 'audit' && (
                        <ViewAudit 
                            siteId={activeSite} drillInfo={drillInfo}
                            onSave={handleSaveAudit} onBack={() => setView('dashboard')}
                        />
                    )}
                    
                    {view === 'summary' && (
                        <ViewSummary drillInfo={drillInfo} audits={audits} onBack={() => setView('dashboard')} />
                    )}

                    {view === 'dashboard' && (
                        <div className="fixed bottom-0 w-full max-w-2xl bg-white/90 backdrop-blur-lg border-t border-gray-100 flex justify-around p-2 pb-safe shadow-[0_-10px_40px_-10px_rgba(0,0,0,0.05)] z-40">
                            <button onClick={() => setView('dashboard')} className="flex flex-col items-center p-2 text-medical-900 relative w-16">
                                <div className="absolute inset-0 bg-medical-50 rounded-xl -z-10"></div>
                                <i className="fas fa-home text-xl mb-1 text-accent-500"></i>
                                <span className="text-[10px] font-black">ראשי</span>
                            </button>
                            <button onClick={() => setView('summary')} className="flex flex-col items-center p-2 text-gray-400 hover:text-medical-900 transition-colors w-16 group">
                                <i className="fas fa-chart-pie text-xl mb-1 group-hover:text-accent-500 transition-colors"></i>
                                <span className="text-[10px] font-bold">סיכום</span>
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
